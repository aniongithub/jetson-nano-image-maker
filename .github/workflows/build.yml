name: Manual Image Build

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board to build
        type: choice
        required: true
        default: all
        options:
          - all
          - jetson-nano
          - jetson-nano-2gb
          - jetson-orin-nano
      compress:
        description: Compress the image with xz before uploading
        type: boolean
        required: false
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select boards
        id: select
        run: |
          if [ "${{ inputs.board }}" = "all" ]; then
            matrix='["jetson-nano","jetson-nano-2gb","jetson-orin-nano"]'
          else
            matrix='["${{ inputs.board }}"]'
          fi
          echo "matrix={\"board\":$matrix}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/_build.yml
    with:
      board: ${{ matrix.board }}
      compress: ${{ inputs.compress }}
      upload-artifact: true
      retention-days: 7
